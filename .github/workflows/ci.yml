name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, testes e Security Rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Os emuladores do Firestore e do Storage rodam em Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache dos emuladores do Firebase
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Tipos
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      # Testes de vazamento entre empresas: se algum passar, o PR fica vermelho.
      - name: Security Rules no emulador
        run: pnpm test:rules

      - name: Functions no emulador (ponta a ponta)
        run: pnpm test:integration
